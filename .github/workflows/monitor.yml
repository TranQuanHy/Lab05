
name: API Monitoring - Shift Right

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Check GET /users response time
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          RESPONSE=$(curl -sS -o /dev/null \
            -w "%{http_code} %{time_total}" \
            -H "Authorization: Bearer $GOREST_TOKEN" \
            "https://gorest.co.in/public/v2/users")

          STATUS=$(echo "$RESPONSE" | awk '{print $1}')
          TIME=$(echo "$RESPONSE" | awk '{print $2}')

          echo "HTTP status: $STATUS"
          echo "Response time: ${TIME}s"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: API returned HTTP $STATUS"
            exit 1
          fi

          if ! awk -v t="$TIME" 'BEGIN { exit !(t < 0.8) }'; then
            echo "ERROR: Response time must be below 800ms"
            exit 1
          fi

          echo "SUCCESS: API is healthy and response time is below 800ms."
