name: GoRest API CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman with Data-Driven Testing
        run: |
          newman run 2474802010158_TranQuanHy_GoRest.json \
            -e 2474802010158_TranQuanHy_GoRest_Env.json \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
